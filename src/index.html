<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude UI Elements</title>
  <!-- Local CSS links removed - will be imported via JS -->
  <!-- External library CSS (like Prism) removed - will be imported via JS or handled by Vite -->
</head>
<body class="dark-theme">
  <div id="claude-app" class="claude-container">
    <div class="claude-header">
      <div class="header-row">
        <div class="header-title-area">
          <h1>Claude UI</h1>
          <a href="https://github.com/1ps0/claude-ui" target="_blank" rel="noopener noreferrer" class="github-link" title="View on GitHub">
            <!-- Simple GitHub Icon SVG -->
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 16 16" fill="currentColor" style="vertical-align: middle;">
              <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
            </svg>
          </a>
        </div>
        <div class="header-actions">
          <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
            <!-- Theme Toggle SVGs -->
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sun-icon"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="moon-icon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
        </div>
      </div>
    </div>
    <!-- Placeholder for dynamically added search bar -->
    <!-- <input type="search" id="conversation-search-input" style="display: none;" /> -->
    <div id="message-container" class="message-container"></div>
    <div class="test-controls">
      <!-- Placeholder for dynamically added back button -->
      <!-- <button id="back-to-list-button" style="display: none;">‹ Back to List</button> -->
      <!-- Removed Load Test Response button -->
      <!-- <button id="load-test-button">Load Test Response</button> -->
      <button id="load-file-button">Load From File</button>
      <input type="file" id="file-input" accept=".json,application/json" style="display:none">
      <button id="clear-button">Clear</button>
    </div>
  </div>

  <!-- All external library and local script tags removed -->
  <!-- Main application script loaded as a module -->
  <!-- Path needs to be relative to the HTML file's location (src/) -->
  <script type="module" src="/js/main.js"></script> 
</body>
</html>
