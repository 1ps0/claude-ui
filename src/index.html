<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude UI Elements</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/message.css">
  <link rel="stylesheet" href="css/artifacts.css">
  <!-- External libraries -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css">
</head>
<body class="dark-theme">
  <div id="claude-app" class="claude-container">
    <div class="claude-header">
      <div class="header-row">
        <h1>Claude UI</h1>
        <div class="header-actions">
          <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sun-icon">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="moon-icon">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
    <div id="message-container" class="message-container"></div>
    <div class="test-controls">
      <!-- Removed Load Test Response button -->
      <!-- <button id="load-test-button">Load Test Response</button> -->
      <button id="load-file-button">Load From File</button>
      <input type="file" id="file-input" accept=".json,application/json" style="display:none">
      <button id="clear-button">Clear</button>
    </div>
  </div>

  <!-- External libraries - removed sourcemaps to prevent 404 errors -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.2.4/mermaid.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.21.4/babel.min.js"></script>

  <!-- Application scripts -->
  <script src="js/renderers/CodeRenderer.js"></script>
  <script src="js/renderers/MarkdownRenderer.js"></script>
  <script src="js/renderers/HtmlRenderer.js"></script>
  <script src="js/renderers/SvgRenderer.js"></script>
  <script src="js/renderers/MermaidRenderer.js"></script>
  <script src="js/renderers/ReactRenderer.js"></script>
  <script src="js/ArtifactFactory.js"></script>
  <script src="js/MessageRenderer.js"></script>
  <script src="js/ClaudeUI.js"></script>
  <!-- Removed test data script -->
  <!-- <script src="test/sampleResponses.js"></script> -->
  <script src="js/main.js"></script>
</body>
</html>
